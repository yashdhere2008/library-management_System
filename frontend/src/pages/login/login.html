<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Library System</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* 🔥 Background */
body {
    height: 100vh;
    background: 
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.85)),
        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66') 
        no-repeat center center/cover;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* 🔥 Glass Box */
.login-box {
    width: 350px;
    padding: 30px;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    color: white;
    text-align: center;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 25px rgba(0,255,255,0.4);
}

h2 { margin-bottom: 5px; }

.subtitle {
    color: #ddd;
    font-size: 14px;
    margin-bottom: 20px;
}

.input-box {
    margin: 15px 0;
    text-align: left;
}

select, input {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: none;
    border-bottom: 2px solid cyan;
    color: white;
    outline: none;
    font-size: 16px;
}

select option { color: black; }

input:focus, select:focus {
    border-bottom: 2px solid #00ffff;
    box-shadow: 0 5px 10px rgba(0,255,255,0.5);
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    background: cyan;
    border: none;
    border-radius: 25px;
    font-size: 18px;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
}

button:hover {
    background: #00bcd4;
    transform: scale(1.05);
}

/* Links */
.links {
    margin-top: 10px;
    font-size: 14px;
}

.links a {
    color: cyan;
    cursor: pointer;
    margin: 0 5px;
}

/* Message */
.message {
    margin-top: 15px;
    color: lightgreen;
    font-weight: bold;
}

/* Hide forms */
.form {
    display: none;
}

.active {
    display: block;
}
</style>
</head>

<body>

<div class="login-box">

    <!-- LOGIN -->
    <div id="loginForm" class="form active">
        <h2>Welcome to the Library Management System</h2>
        <p class="subtitle">Login to continue...</p>

        <div class="input-box">
            <select id="role">
                <option value="">Select Role</option>
                <option>Student</option>
                <option>Admin</option>
                <option>Librarian</option>
            </select>
        </div>

        <div class="input-box">
            <input type="text" id="username" placeholder="Username">
        </div>

        <div class="input-box">
            <input type="password" id="password" placeholder="Password">
        </div>

        <button onclick="login()">Login</button>

        <div class="links">
            <a onclick="showForm('registerForm')">Create Account</a> |
            <a onclick="showForm('forgotForm')">Forgot Password?</a>
        </div>

        <div class="message" id="msg"></div>
    </div>

    <!-- REGISTER -->
    <div id="registerForm" class="form">
        <h2>Create Account</h2>

        <div class="input-box">
            <input type="text" placeholder="Full Name">
        </div>

        <div class="input-box">
            <input type="email" placeholder="Email">
        </div>

        <div class="input-box">
            <input type="text" placeholder="Username">
        </div>

        <div class="input-box">
            <input type="password" placeholder="Password">
        </div>

        <button onclick="register()">Register</button>

        <div class="links">
            <a onclick="showForm('loginForm')">Back to Login</a>
        </div>

        <div class="message" id="regMsg"></div>
    </div>

    <!-- FORGOT PASSWORD -->
    <div id="forgotForm" class="form">
        <h2>Forgot Password</h2>

        <div class="input-box">
            <input type="email" placeholder="Enter your email">
        </div>

        <button onclick="resetPassword()">Reset Password</button>

        <div class="links">
            <a onclick="showForm('loginForm')">Back to Login</a>
        </div>

        <div class="message" id="forgotMsg"></div>
    </div>

</div>

<script>
function showForm(formId) {
    document.getElementById("loginForm").classList.remove("active");
    document.getElementById("registerForm").classList.remove("active");
    document.getElementById("forgotForm").classList.remove("active");

    document.getElementById(formId).classList.add("active");
}

function login() {
    let role = document.getElementById("role").value;
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if(role === "" || username === "" || password === "") {
        document.getElementById("msg").innerHTML = "⚠ Please fill all fields!";
    } else {
        document.getElementById("msg").innerHTML =
            "✅ Login Successful as " + role + "!";
    }
}

function register() {
    document.getElementById("regMsg").innerHTML =
        "✅ Account Created Successfully!";
}

function resetPassword() {
    document.getElementById("forgotMsg").innerHTML =
        "📧 Password Reset Link Sent!";
}
</script>

</body>
</html>
