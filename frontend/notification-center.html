<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification Center</title>
  <style>
    :root {
      --bg: #eff3ff;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #dbeafe;
      --success: #16a34a;
      --warning: #d97706;
      --error: #dc2626;
      --info: #2563eb;
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #f8fbff 0%, #eef3ff 35%, #eef3ff 100%);
      color: var(--text);
    }

    .page {
      width: min(1140px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 1.25rem;
      font-weight: 800;
    }

    .brand-icon {
      width: 46px;
      aspect-ratio: 1;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb 0%, #93c5fd 100%);
      display: grid;
      place-items: center;
      color: white;
      font-size: 1.2rem;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
      padding: 14px 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(15, 23, 42, 0.06);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
    }

    .nav-links a.active {
      color: var(--text);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .pill {
      border-radius: 999px;
      padding: 10px 16px;
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      margin-bottom: 22px;
    }

    .hero-title {
      margin: 0;
      font-size: clamp(1.6rem, 2.5vw, 2.4rem);
      line-height: 1.05;
    }

    .hero-subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.97rem;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 200px auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 20px;
    }

    .filter-row input,
    .filter-row select,
    .notification-form input,
    .notification-form textarea,
    .notification-form select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 1rem;
      background: white;
      color: var(--text);
      outline: none;
    }

    .filter-row input::placeholder {
      color: #94a3b8;
    }

    .button {
      border: none;
      border-radius: 16px;
      padding: 16px 22px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      background: #2563eb;
      color: white;
    }

    .button:hover { transform: translateY(-1px); }

    .main-grid {
      display: grid;
      gap: 24px;
      grid-template-columns: minmax(320px, 360px) 1fr;
    }

    .panel {
      background: white;
      border-radius: 24px;
      border: 1px solid rgba(15, 23, 42, 0.07);
      padding: 24px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
    }

    .panel h2 {
      margin: 0 0 18px;
      font-size: 1.2rem;
    }

    .notification-form {
      display: grid;
      gap: 16px;
    }

    .notification-form textarea {
      min-height: 120px;
      resize: vertical;
    }

    .notification-list {
      display: grid;
      gap: 16px;
    }

    .notification-card {
      border-radius: 20px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      padding: 22px;
      display: grid;
      gap: 14px;
      background: white;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .notification-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
    }

    .notification-card.unread {
      background: #eff6ff;
    }

    .notification-header {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .notification-title {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.3;
    }

    .notification-title.unread {
      font-weight: 800;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .tag.success { background: #d1fae5; color: var(--success); }
    .tag.warning { background: #fff7cd; color: var(--warning); }
    .tag.error { background: #fee2e2; color: var(--error); }
    .tag.info { background: #dbeafe; color: var(--info); }

    .status-pill {
      border-radius: 999px;
      padding: 0.55rem 0.9rem;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-pill.read { background: #f8fafc; color: #475569; }
    .status-pill.unread { background: #2563eb; color: white; }

    .notification-message {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .notification-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: #64748b;
      font-size: 0.95rem;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .card-actions button {
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 16px;
      padding: 12px 18px;
      font-size: 0.95rem;
      cursor: pointer;
      background: white;
      color: var(--text);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card-actions button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08);
    }

    .card-actions button.delete {
      border-color: rgba(220, 38, 38, 0.18);
      color: var(--error);
    }

    .empty-state {
      text-align: center;
      padding: 36px 20px;
      color: var(--muted);
      border: 2px dashed rgba(15, 23, 42, 0.12);
      border-radius: 20px;
      background: #f8fafc;
    }

    @media (max-width: 900px) {
      .hero, .main-grid {
        grid-template-columns: 1fr;
      }

      .nav-links {
        justify-content: center;
      }
    }

    @media (max-width: 700px) {
      .filter-row {
        grid-template-columns: 1fr;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <div class="brand-icon">N</div>
        <div>
          <div>Fourise</div>
          <div style="font-size:0.95rem; color:#64748b;">Notification Center</div>
        </div>
      </div>

      <nav class="nav-links">
        <a href="#" class="active">Home</a>
        <a href="#">Dashboard</a>
        <a href="#">Notifications</a>
        <a href="#">Profile</a>
      </nav>

      <div class="nav-actions">
        <div class="pill"><span>🔔</span> Notifications (<span id="unread-count">0</span>)</div>
      </div>
    </div>

    <div class="hero">
      <div>
        <h1 class="hero-title">Notification Center</h1>
        <p class="hero-subtitle">Manage alerts, mark read/unread, delete notifications, and search by title or message.</p>
      </div>
      <button class="button" id="add-button">+ Add Notification</button>
    </div>

    <div class="filter-row">
      <input id="search-input" type="search" placeholder="Search by title or message..." />
      <select id="filter-select">
        <option value="all">All</option>
        <option value="success">Success</option>
        <option value="error">Error</option>
        <option value="warning">Warning</option>
        <option value="info">Info</option>
      </select>
      <div style="display:flex; justify-content:flex-end;">
        <button class="button" id="top-add-button">+ Add Notification</button>
      </div>
    </div>

    <div class="main-grid">
      <section class="panel">
        <h2>Add Notification</h2>
        <form id="notification-form" class="notification-form">
          <input id="title-input" type="text" placeholder="Title" required />
          <textarea id="message-input" placeholder="Message" required></textarea>
          <select id="type-select">
            <option value="success">Success</option>
            <option value="warning">Warning</option>
            <option value="error">Error</option>
            <option value="info">Info</option>
          </select>
          <div class="button-row">
            <button type="submit" class="button primary">Add Notification</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2>Notifications</h2>
        <div id="notifications-list" class="notification-list"></div>
        <div id="empty-state" class="empty-state" style="display: none;">
          No notifications match your search and filter.
        </div>
      </section>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'notificationCenterData'
    const sampleNotifications = [
      {
        id: 1,
        title: 'Project Submitted',
        message: 'Your project has been submitted successfully.',
        type: 'success',
        isRead: false,
        createdAt: '2026-07-06T10:12:00.000Z',
      },
      {
        id: 2,
        title: 'Assignment deadline is tomorrow.',
        message: 'Reminder: Your assignment is due tomorrow.',
        type: 'warning',
        isRead: false,
        createdAt: '2026-07-06T09:15:00.000Z',
      },
      {
        id: 3,
        title: 'Payment failed',
        message: 'Your payment failed. Please try again.',
        type: 'error',
        isRead: true,
        createdAt: '2026-07-05T14:30:00.000Z',
      },
      {
        id: 4,
        title: 'New feature released',
        message: 'We launched a new notification center feature.',
        type: 'info',
        isRead: true,
        createdAt: '2026-07-04T08:00:00.000Z',
      },
    ]

    const form = document.getElementById('notification-form')
    const titleInput = document.getElementById('title-input')
    const messageInput = document.getElementById('message-input')
    const typeSelect = document.getElementById('type-select')
    const notificationsList = document.getElementById('notifications-list')
    const unreadCountElement = document.getElementById('unread-count')
    const searchInput = document.getElementById('search-input')
    const filterSelect = document.getElementById('filter-select')
    const emptyState = document.getElementById('empty-state')
    const addButton = document.getElementById('add-button')
    const topAddButton = document.getElementById('top-add-button')

    let notifications = []

    function loadNotifications() {
      const stored = localStorage.getItem(STORAGE_KEY)
      notifications = stored ? JSON.parse(stored) : sampleNotifications
      saveNotifications()
    }

    function saveNotifications() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notifications))
    }

    function updateUnreadCount() {
      const unreadCount = notifications.filter(notification => !notification.isRead).length
      unreadCountElement.textContent = unreadCount
    }

    function getRelativeDate(dateString) {
      const date = new Date(dateString)
      const now = new Date()
      const diff = Math.max(0, now - date)
      const minutes = Math.floor(diff / 60000)
      const hours = Math.floor(diff / 3600000)
      const days = Math.floor(diff / 86400000)

      if (minutes < 2) return 'Just now'
      if (minutes < 60) return `${minutes} mins ago`
      if (hours < 24) return `${hours} hour${hours > 1 ? 's' : ''} ago`
      if (days === 1) return 'Yesterday'
      return `${days} days ago`
    }

    function getVisibleNotifications() {
      const searchValue = searchInput.value.trim().toLowerCase()
      const filterValue = filterSelect.value

      return notifications.filter(notification => {
        const matchesSearch =
          notification.title.toLowerCase().includes(searchValue) ||
          notification.message.toLowerCase().includes(searchValue)
        const matchesFilter = filterValue === 'all' || notification.type === filterValue
        return matchesSearch && matchesFilter
      })
    }

    function createNotificationCard(notification) {
      const card = document.createElement('article')
      card.className = 'notification-card'
      if (!notification.isRead) card.classList.add('unread')

      const header = document.createElement('div')
      header.className = 'notification-header'

      const title = document.createElement('h3')
      title.className = 'notification-title'
      title.textContent = notification.title
      if (!notification.isRead) title.classList.add('unread')

      const tagRow = document.createElement('div')
      tagRow.className = 'tag-row'

      const typeTag = document.createElement('span')
      typeTag.className = `tag ${notification.type}`
      typeTag.textContent = notification.type.charAt(0).toUpperCase() + notification.type.slice(1)

      const statusTag = document.createElement('span')
      statusTag.className = 'status-pill ' + (notification.isRead ? 'read' : 'unread')
      statusTag.textContent = notification.isRead ? 'Read' : 'Unread'

      tagRow.append(typeTag, statusTag)
      header.append(title, tagRow)

      const message = document.createElement('p')
      message.className = 'notification-message'
      message.textContent = notification.message

      const meta = document.createElement('div')
      meta.className = 'notification-meta'
      meta.innerHTML = `<span>${getRelativeDate(notification.createdAt)}</span><span>${new Date(notification.createdAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}</span>`

      const actions = document.createElement('div')
      actions.className = 'card-actions'

      const toggleButton = document.createElement('button')
      toggleButton.textContent = notification.isRead ? 'Mark as Unread' : 'Mark as Read'
      toggleButton.addEventListener('click', () => {
        notification.isRead = !notification.isRead
        saveNotifications()
        renderNotifications()
      })

      const deleteButton = document.createElement('button')
      deleteButton.className = 'delete'
      deleteButton.textContent = 'Delete'
      deleteButton.addEventListener('click', () => {
        const confirmed = confirm('Are you sure you want to delete this notification?')
        if (!confirmed) return
        notifications = notifications.filter(item => item.id !== notification.id)
        saveNotifications()
        renderNotifications()
      })

      actions.append(toggleButton, deleteButton)
      card.append(header, message, meta, actions)
      return card
    }

    function renderNotifications() {
      notificationsList.innerHTML = ''
      const visible = getVisibleNotifications()
      if (visible.length === 0) {
        emptyState.style.display = 'block'
      } else {
        emptyState.style.display = 'none'
      }
      visible.forEach(notification => notificationsList.append(createNotificationCard(notification)))
      updateUnreadCount()
    }

    function openForm() {
      titleInput.focus()
    }

    form.addEventListener('submit', event => {
      event.preventDefault()
      const title = titleInput.value.trim()
      const message = messageInput.value.trim()
      const type = typeSelect.value
      if (!title || !message) return
      notifications.unshift({
        id: Date.now(),
        title,
        message,
        type,
        isRead: false,
        createdAt: new Date().toISOString(),
      })
      saveNotifications()
      renderNotifications()
      form.reset()
      typeSelect.value = 'success'
      openForm()
    })

    searchInput.addEventListener('input', renderNotifications)
    filterSelect.addEventListener('change', renderNotifications)
    addButton.addEventListener('click', openForm)
    topAddButton.addEventListener('click', openForm)

    loadNotifications()
    renderNotifications()
  </script>
</body>
</html>
